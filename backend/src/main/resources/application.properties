spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tcc_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tcc_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tcc_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true

security.crypto.secret=9s8d7f6a5s4d3f2g

api.security.token.secret=my-secret

# Email Configuration (desenvolvimento com MailHog)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Email sender
app.mail.from=noreply@talkie.com
app.mail.from-name=Talkie Plataforma

# Upload de imagens das ocorrências (diretório local; fora do git)
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
