services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talkie_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tcc_db
      SPRING_DATASOURCE_USERNAME: tcc_user
      SPRING_DATASOURCE_PASSWORD: tcc_password
      SPRING_MAIL_HOST: mailhog
    depends_on:
      - postgres
    networks:
      - talkie_network

  postgres:
    image: postgres:16
    container_name: tcc_postgres
    restart: always
    environment:
      POSTGRES_DB: tcc_db
      POSTGRES_USER: tcc_user
      POSTGRES_PASSWORD: tcc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talkie_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tcc_mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - talkie_network

volumes:
  postgres_data:

networks:
  talkie_network:
    driver: bridge